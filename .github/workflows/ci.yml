name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: format · lint · API check · tests · smoke (server/boot/client) · balance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Roblox toolchain (lune / stylua / selene / rojo / wally)
        run: |
          ./scripts/install_tools.sh "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Format check (StyLua)
        run: stylua --check src tools

      - name: Lint (Selene)
        run: selene src tools

      - name: Roblox API check (props / enums / services vs API dump)
        run: python3 scripts/check_roblox_api.py

      - name: Tests (Lune)
        run: lune run tools/test

      - name: Server smoke test (Roblox API mock)
        run: lune run tools/server_smoke

      - name: Boot robustness (virtual-time scheduler; hangs / failures / fallbacks)
        run: lune run tools/boot_smoke

      - name: Client end-to-end (real client scripts vs real server, every screen + flows)
        run: lune run tools/client_smoke

      - name: Rojo build with build stamp (validates project tree)
        run: ./scripts/build.sh /tmp/VoxelPets.rbxl

      - name: Balance snapshot (quick)
        run: lune run tools/sim_batch -- --quick
